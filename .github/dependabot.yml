# 依存の更新 PR を GitHub に作らせる設定（docs/developers.md §4.10）。
#
# 方針（監査コメント #61 の提案 D）:
# - **minor / patch は 1 本にまとめる**。レビューの量を一定に保つため。
# - **major はまとめない**。破壊的変更は 1 件ずつ見る（例: astro 7.4 は Node の下限を
#   22.23.4 へ上げるので、`website/package.json` の engines と開発環境を一緒に直す必要がある）。
# - security の更新は Dependabot alerts 側が別の PR として作る（version-update とは別枠）。
#   alerts の有効化はリポジトリ設定の操作なので、このファイルでは済まない（§4.10 の手順 1）。
# - **自動 merge はしない**。検査が緑でも人が内容を確認してマージする。
#   `gh pr merge --auto` を使うワークフローは存在せず、検査 14 が復活を落とす。
# - 更新先は `develop`。既定ブランチは `main`（リリースゲート）なので、依存の更新を
#   直接 main へ入れない。develop 向け PR は CI の行列が小さい（§4.7 の CI_SCOPE）。
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    labels: ["dependencies", "rust"]
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

