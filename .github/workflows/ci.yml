name: CI

# PLANS.md §5.1 作業項目 4 / §6.2、SPECIFICATIONS.md §18.4 の 4 ジョブ。
# `spec` ジョブは PLANS.md §9.4 B-14 の決定により M11 で追加する。
# `wasm` ジョブを `trunk build` にしない判断は PLANS.md §9.2 B-16 を参照。
#
# ## 失敗の読み方（2026-10-11 に改善）
#
# 各ジョブは cargo の出力を `/tmp/ci.log` に tee し、**`.github/report.py` が生ログから
# 「どれが・どこで・何と言って失敗したか」だけを抜き出す**。出力は 3 つ。
#
# 1. **ワークフロー注釈**（`::error file=…,line=…::`）— コンパイルエラーとテストの panic 位置が
#    PR の「Files changed」とチェック画面にインラインで出る。
# 2. **実行サマリ**（`$GITHUB_STEP_SUMMARY`）— 成功時も書く。テスト件数の内訳が出るので、
#    run のページを開けば緑の証跡（何件通ったか）がその場で分かる。
# 3. **PR コメント**（失敗時のみ）— Actions のログ取得先ホスト（`objects.githubusercontent.com`）に
#    作業環境から到達できないため、**失敗の中身を読む経路はこれしかない**（PLANS.md §9.3）。
#    `gh api repos/:owner/:repo/issues/:number/comments` で取得できる。
#
# `head` / `tail` の切り出しをやめた理由: テスト失敗の本体（`---- <name> stdout ----`）はログの
# **真ん中**にあり、切り出しではちょうど落ちる。判断は PLANS.md §9.2 B-55。
#
# `cargo test` は **`--no-fail-fast`**: 既定だと最初の失敗ターゲットで止まり、残りの形式の
# 失敗が一度に見えない（1 回の CI で全部知るための変更。失敗時のみ実行時間が伸びる）。
#
# レポート生成自体は CI の合否に影響させない（`|| echo "::warning::…"`）。レポートのバグで
# 緑のビルドが赤くなっては本末転倒なので。
#
# 2026-10-11 以降は作業環境側に Rust ツールチェーンがあり（PLANS.md §9.3、
# `.github/workflows/toolchain-export.yml` が生成）、fmt / clippy / test / wasm の 4 つは
# すべてローカルで実行できる。CI は「緑の証跡」として残す。
# 不要になったら「Comment on the PR」ステップと `pull-requests: write` を外す。

# paths-ignore: 4 ジョブはどれも Rust のソースと Cargo.* しか見ないので、ドキュメントと
# ワークフローだけの commit では走らせない（Actions 使用時間の節約）。
# 状態チェックを必須にしている場合は両方の paths-ignore を外すこと。
# （GitHub Actions は YAML アンカーを使えないので同じ一覧を 2 か所に書いている。）
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - '.github/**'
      - 'assets/**'
      - 'screenshot.jpeg'
      - 'LICENSE'
  pull_request:
    # draft の間は 4 ジョブを skip し、ready for review にした時点で 1 回だけ走らせる
    # （2026-10-13。作業中は push のたびにローカルで 4 ジョブを確認済みなので、CI は
    # 「緑の証跡」を最後に 1 回残せば足りる。Actions 使用時間を抑えるユーザー指示）。
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - '.github/**'
      - 'assets/**'
      - 'screenshot.jpeg'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

# PR のときは新しい push で古い実行を取り消す。main への push は最後まで走らせる
# （マージ結果の検証が途中で消えると、緑の証跡が残らないため）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 4 ジョブ共通の環境変数。
env:
  # レポートの見出しに載せる commit（`.github/report.py` が読む）
  CI_SHA: ${{ github.sha }}
  # backtrace はレポートを埋めるだけで、失敗の理由は panic メッセージで足りる（読みやすさ優先）
  RUST_BACKTRACE: 0

jobs:
  fmt:
    name: Rustfmt
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    # 暴走しても課金が伸びないようにする（Actions 使用時間の節約）
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # pipefail: パイプ先の tee が成功しても cargo の失敗でステップを落とす
      # ::group:: で生ログを折りたたむ（読むのはレポートのほう）
      - name: cargo fmt --check
        id: cargo
        shell: bash
        run: |
          set -o pipefail
          echo "::group::cargo fmt --all --check（生ログ）"
          cargo fmt --all --check 2>&1 | tee /tmp/ci.log
          status=$?
          echo "::endgroup::"
          exit $status
      - name: Report to the run summary
        if: always() && steps.cargo.outcome != 'skipped'
        shell: bash
        env:
          CI_LOG: /tmp/ci.log
          CI_JOB: Rustfmt
          CI_KIND: fmt
          CI_STATUS: ${{ steps.cargo.outcome }}
        run: python3 .github/report.py /tmp/body.md || echo "::warning::レポートの生成に失敗しました（合否には影響しません）"
      - name: Comment on the PR
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/body.md

  clippy:
    name: Clippy
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # --all-targets: tests/ 配下（layering.rs を含む）も lint する
      # --locked: Cargo.lock と Cargo.toml の乖離を落とす
      # `--features ui` を付けない: GUI のクレート（egui / eframe / rfd / fontdb / toml）は
      # optional で既定のビルドに入れない（PLANS.md §2.1 の feature gate・§9.2 B-54）。
      # TODO(M7): src/ui/** に egui の実コードが入ったら、clippy / test / wasm の 3 コマンドに
      #           `--features ui` を足す（PLANS.md §5.8 作業項目 0）。
      - name: cargo clippy
        id: cargo
        shell: bash
        run: |
          set -o pipefail
          echo "::group::cargo clippy（生ログ）"
          cargo clippy --locked --all-targets -- -D warnings 2>&1 | tee /tmp/ci.log
          status=$?
          echo "::endgroup::"
          exit $status
      - name: Report to the run summary
        if: always() && steps.cargo.outcome != 'skipped'
        shell: bash
        env:
          CI_LOG: /tmp/ci.log
          CI_JOB: Clippy
          CI_KIND: clippy
          CI_STATUS: ${{ steps.cargo.outcome }}
        run: python3 .github/report.py /tmp/body.md || echo "::warning::レポートの生成に失敗しました（合否には影響しません）"
      - name: Comment on the PR
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/body.md

  test:
    name: Test
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # tests/layering.rs（§3.2 の禁止依存 + §12.2 の日本語リテラル + feature gate + 検査器の
      # 自己テスト）を含む全ターゲットを実行する。DEVELOPERS.md §1.4「layering が落ちたら
      # マージしない」。
      # --no-fail-fast: 既定だと**最初の失敗ターゲットで止まる**（統合テストはアルファベット順）
      # ので、1 回の CI で全形式の失敗を知るために外す。
      # `--features ui` は付けない（上の clippy ジョブと同じ理由。PLANS.md §9.2 B-54）。
      - name: cargo test
        id: cargo
        shell: bash
        run: |
          set -o pipefail
          echo "::group::cargo test（生ログ）"
          cargo test --locked --all-targets --no-fail-fast 2>&1 | tee /tmp/ci.log
          status=$?
          echo "::endgroup::"
          exit $status
      - name: Report to the run summary
        if: always() && steps.cargo.outcome != 'skipped'
        shell: bash
        env:
          CI_LOG: /tmp/ci.log
          CI_JOB: Test
          CI_KIND: test
          CI_STATUS: ${{ steps.cargo.outcome }}
        run: python3 .github/report.py /tmp/body.md || echo "::warning::レポートの生成に失敗しました（合否には影響しません）"
      - name: Comment on the PR
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/body.md

  wasm:
    name: WASM Build Check
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # `--features ui` は付けない（上の clippy ジョブと同じ理由。PLANS.md §9.2 B-54）。
      - name: cargo check (wasm32)
        id: cargo
        shell: bash
        run: |
          set -o pipefail
          echo "::group::cargo check --target wasm32-unknown-unknown（生ログ）"
          cargo check --locked --target wasm32-unknown-unknown 2>&1 | tee /tmp/ci.log
          status=$?
          echo "::endgroup::"
          exit $status
      - name: Report to the run summary
        if: always() && steps.cargo.outcome != 'skipped'
        shell: bash
        env:
          CI_LOG: /tmp/ci.log
          CI_JOB: WASM Build Check
          CI_KIND: wasm
          CI_STATUS: ${{ steps.cargo.outcome }}
        run: python3 .github/report.py /tmp/body.md || echo "::warning::レポートの生成に失敗しました（合否には影響しません）"
      - name: Comment on the PR
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/body.md
