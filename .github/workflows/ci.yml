name: CI

# PLANS.md §5.1 作業項目 4 / §6.2、SPECIFICATIONS.md §18.4 の 4 ジョブ。
# `spec` ジョブは PLANS.md §9.4 B-14 の決定により M11 で追加する。
# `wasm` ジョブを `trunk build` にしない判断は PLANS.md §9.2 B-16 を参照。
#
# 失敗時は各ジョブの出力を PR コメントに投稿する。Actions のログ取得先ホストに到達できないため、
# **合否だけでなくコンパイルエラーの中身を読む経路**が要る。コメントは
# `gh api repos/:owner/:repo/issues/:number/comments` で取得できる。
# 2026-10-11 以降は作業環境側に Rust ツールチェーンがあり（PLANS.md §9.3、
# `.github/workflows/toolchain-export.yml` が生成）、fmt / clippy / test / wasm の 4 つは
# すべてローカルで実行できる。CI は「緑の証跡」として残す。
# 不要になったら「Report ... to the PR」ステップと `pull-requests: write` を外す。

# paths-ignore: 4 ジョブはどれも Rust のソースと Cargo.* しか見ないので、ドキュメントと
# ワークフローだけの commit では走らせない（Actions 使用時間の節約）。
# 状態チェックを必須にしている場合は両方の paths-ignore を外すこと。
# （GitHub Actions は YAML アンカーを使えないので同じ一覧を 2 か所に書いている。）
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - '.github/**'
      - 'assets/**'
      - 'screenshot.jpeg'
      - 'LICENSE'
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - '.github/**'
      - 'assets/**'
      - 'screenshot.jpeg'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

# PR のときは新しい push で古い実行を取り消す。main への push は最後まで走らせる
# （マージ結果の検証が途中で消えると、緑の証跡が残らないため）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # pipefail: パイプ先の tee が成功しても cargo の失敗でステップを落とす
      - name: cargo fmt --check
        shell: bash
        run: |
          set -o pipefail
          cargo fmt --all --check 2>&1 | tee /tmp/ci.log
      - name: Report fmt diff to the PR
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### Rustfmt が失敗（\`${GITHUB_SHA::7}\`）"
            echo '下の差分を `cargo fmt --all` で適用できます。'
            echo '```diff'
            head -n 160 /tmp/ci.log
            echo '```'
          } > /tmp/body.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/body.md

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # --all-targets: tests/ 配下（layering.rs を含む）も lint する
      # --locked: Cargo.lock と Cargo.toml の乖離を落とす
      # `--features ui` を付けない: GUI のクレート（egui / eframe / rfd / fontdb / toml）は
      # optional で既定のビルドに入れない（PLANS.md §2.1 の feature gate・§9.2 B-54）。
      # TODO(M7): src/ui/** に egui の実コードが入ったら、clippy / test / wasm の 3 コマンドに
      #           `--features ui` を足す（PLANS.md §5.8 作業項目 0）。
      - name: cargo clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --locked --all-targets -- -D warnings 2>&1 | tee /tmp/ci.log
      - name: Report clippy output to the PR
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### Clippy が失敗（\`${GITHUB_SHA::7}\`）"
            echo '```'
            head -n 120 /tmp/ci.log
            echo '...（中略）...'
            tail -n 40 /tmp/ci.log
            echo '```'
          } > /tmp/body.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/body.md

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # tests/layering.rs（§3.2 の禁止依存 + §12.2 の日本語リテラル + 検査器の自己テスト）を
      # 含む全ターゲットを実行する。DEVELOPERS.md §1.4「layering が落ちたらマージしない」。
      - name: cargo test
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --all-targets 2>&1 | tee /tmp/ci.log
      - name: Report test output to the PR
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### Test が失敗（\`${GITHUB_SHA::7}\`）"
            echo '```'
            head -n 120 /tmp/ci.log
            echo '...（中略）...'
            tail -n 60 /tmp/ci.log
            echo '```'
          } > /tmp/body.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/body.md

  wasm:
    name: WASM Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: cargo check (wasm32)
        shell: bash
        run: |
          set -o pipefail
          cargo check --locked --target wasm32-unknown-unknown 2>&1 | tee /tmp/ci.log
      - name: Report wasm output to the PR
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### WASM Build Check が失敗（\`${GITHUB_SHA::7}\`）"
            echo '```'
            head -n 120 /tmp/ci.log
            echo '...（中略）...'
            tail -n 40 /tmp/ci.log
            echo '```'
          } > /tmp/body.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/body.md
