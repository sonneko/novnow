name: CI

# PLANS.md §5.1 作業項目 4 / §6.2、SPECIFICATIONS.md §18.4 の 4 ジョブ。
# `spec` ジョブは PLANS.md §9.4 B-14 の決定により M11 で追加する。
# `wasm` ジョブを `trunk build` にしない判断は PLANS.md §9.2 B-16 を参照。

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

# PR のときは新しい push で古い実行を取り消す。main への push は最後まで走らせる
# （マージ結果の検証が途中で消えると、緑の証跡が残らないため）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # --all-targets: tests/ 配下（layering.rs を含む）も lint する
      # --locked: Cargo.lock と Cargo.toml の乖離を落とす
      - run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # tests/layering.rs（§3.2 の禁止依存 + §12.2 の日本語リテラル + 検査器の自己テスト）を
      # 含む全ターゲットを実行する。DEVELOPERS.md §1.4「layering が落ちたらマージしない」。
      - run: cargo test --locked --all-targets

  wasm:
    name: WASM Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --target wasm32-unknown-unknown
