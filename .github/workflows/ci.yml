name: CI

# docs/specifications/workflows.md §18.4 の継続的検証ワークフロー。
#
# ジョブ構成:
# 1. `docs` (Docs & Change Filter):
#    - `python3 docs/script/duplicate.py` を実行し、ドキュメント管理規則・REF 整合性・SYNC ブロックを検証する。
#    - 変更ファイルを判定し、開発者文書（docs/{developers,plans,handoff,history}.md, docs/designs/**, README.md 等）
#      のみの変更であれば `rust_changed=false` を出力して後続の重い Rust ジョブ 5 本を自動スキップする。
#    - 注意: `docs/specifications/**` および `examples/sample-novel/**` は `include_str!` でテスト・本体に
#      埋め込まれているため、これらが変更された場合は `rust_changed=true` として Rust ジョブも実行する。
# 2. `fmt` (Rustfmt)
# 3. `clippy` (Clippy: GUI あり + GUI なし)
# 4. `test` (Test: GUI あり全ターゲット + GUI なし CLI)
# 5. `wasm` (WASM Build Check: wasm32 check + trunk build --release & 8MiB サイズ検査 + windows check)
# 6. `bench` (Benchmarks: criterion ベンチマーク §18.1)

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'screenshot.jpeg'
      - 'LICENSE'
      - '.github/toolchain.env'
      - '.github/sandbox-tools.env'
      - '.github/workflows/toolchain-export.yml'
      - '.github/workflows/sandbox-tools.yml'
  pull_request:
    # draft の間はジョブを skip し、ready for review にした時点で走らせる（Actions 使用時間の節約）。
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - master
    paths-ignore:
      - 'screenshot.jpeg'
      - 'LICENSE'
      - '.github/toolchain.env'
      - '.github/sandbox-tools.env'
      - '.github/workflows/toolchain-export.yml'
      - '.github/workflows/sandbox-tools.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

# PR のときは新しい push で古い実行を取り消す。main への push は最後まで走らせる。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI_SHA: ${{ github.sha }}
  RUST_BACKTRACE: 0

jobs:
  docs:
    name: Docs & Change Filter
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust_changed: ${{ steps.filter.outputs.rust_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify documentation rules (duplicate.py)
        run: python3 docs/script/duplicate.py

      - name: Verify website diagnostic catalog covers all codes
        run: python3 scripts/diagnostics-site.py --check

      - name: Detect whether Rust build/test inputs changed
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "rust_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "rust_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$base" HEAD)"
          echo "Changed files:"
          echo "$changed"
          rust_changed=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              docs/developers.md|docs/plans.md|docs/handoff.md|docs/history.md|docs/designs/*|docs/script/*|README.md|LICENSE|screenshot.jpeg|.github/workflows/deploy.yml|.github/workflows/sandbox-tools.yml|.github/workflows/toolchain-export.yml|.github/*.env)
                ;;
              *)
                rust_changed=true
                break
                ;;
            esac
          done <<< "$changed"
          echo "rust_changed=$rust_changed"
          echo "rust_changed=$rust_changed" >> "$GITHUB_OUTPUT"

  fmt:
    name: Rustfmt
    needs: docs
    if: needs.docs.outputs.rust_changed == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        id: cargo
        shell: bash
        run: |
          set -o pipefail
          echo "::group::cargo fmt --all --check（生ログ）"
          cargo fmt --all --check 2>&1 | tee /tmp/ci.log
          status=$?
          echo "::endgroup::"
          exit $status
      - name: Report to the run summary
        if: always() && steps.cargo.outcome != 'skipped'
        shell: bash
        env:
          CI_LOG: /tmp/ci.log
          CI_JOB: Rustfmt
          CI_KIND: fmt
          CI_STATUS: ${{ steps.cargo.outcome }}
        run: python3 .github/report.py /tmp/body.md || echo "::warning::レポートの生成に失敗しました（合否には影響しません）"
      - name: Comment on the PR
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/body.md

  clippy:
    name: Clippy
    needs: docs
    if: needs.docs.outputs.rust_changed == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
      - name: cargo clippy
        id: cargo
        shell: bash
        run: |
          set -o pipefail
          status=0
          echo "::group::cargo clippy --features ui（生ログ）"
          cargo clippy --locked --all-targets --features ui -- -D warnings 2>&1 | tee /tmp/ci.log || status=$?
          echo "::endgroup::"
          echo "::group::cargo clippy（GUI なしの既定のビルド、生ログ）"
          cargo clippy --locked --all-targets -- -D warnings 2>&1 | tee -a /tmp/ci.log || status=$?
          echo "::endgroup::"
          exit $status
      - name: Report to the run summary
        if: always() && steps.cargo.outcome != 'skipped'
        shell: bash
        env:
          CI_LOG: /tmp/ci.log
          CI_JOB: Clippy
          CI_KIND: clippy
          CI_STATUS: ${{ steps.cargo.outcome }}
        run: python3 .github/report.py /tmp/body.md || echo "::warning::レポートの生成に失敗しました（合否には影響しません）"
      - name: Comment on the PR
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/body.md

  test:
    name: Test
    needs: docs
    if: needs.docs.outputs.rust_changed == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
      - name: cargo test
        id: cargo
        shell: bash
        run: |
          set -o pipefail
          status=0
          echo "::group::cargo test --features ui（生ログ）"
          cargo test --locked --all-targets --no-fail-fast --features ui 2>&1 | tee /tmp/ci.log || status=$?
          echo "::endgroup::"
          echo "::group::cargo test --test cli（GUI なしの既定のビルド、生ログ）"
          cargo test --locked --test cli --no-fail-fast 2>&1 | tee -a /tmp/ci.log || status=$?
          echo "::endgroup::"
          exit $status
      - name: Report to the run summary
        if: always() && steps.cargo.outcome != 'skipped'
        shell: bash
        env:
          CI_LOG: /tmp/ci.log
          CI_JOB: Test
          CI_KIND: test
          CI_STATUS: ${{ steps.cargo.outcome }}
        run: python3 .github/report.py /tmp/body.md || echo "::warning::レポートの生成に失敗しました（合否には影響しません）"
      - name: Comment on the PR
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/body.md

  wasm:
    name: WASM Build Check
    needs: docs
    if: needs.docs.outputs.rust_changed == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
      - name: Cache Trunk binary
        id: trunk-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/trunk
          key: trunk-v0.21.5-x86_64-unknown-linux-gnu
      - name: Install trunk
        if: steps.trunk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/trunk-rs/trunk/releases/download/v0.21.5/trunk-x86_64-unknown-linux-gnu.tar.gz \
            | tar xzf - -C "$HOME/.cargo/bin"
          trunk --version
      - name: trunk build --release & cargo check (wasm32 / windows)
        id: cargo
        shell: bash
        run: |
          set -o pipefail
          status=0
          echo "::group::cargo check --target wasm32-unknown-unknown（生ログ）"
          cargo check --locked --target wasm32-unknown-unknown --features ui 2>&1 | tee /tmp/ci.log || status=$?
          echo "::endgroup::"
          echo "::group::trunk build --release & wasm サイズ検査（§18.1 / §18.4）"
          trunk build --release 2>&1 | tee -a /tmp/ci.log || status=$?
          if [ "$status" = 0 ]; then
            wasm_file="$(ls dist/*_bg.wasm 2>/dev/null | head -1)"
            if [ -z "$wasm_file" ]; then
              echo "::error::dist/*_bg.wasm が生成されていません" | tee -a /tmp/ci.log
              status=1
            else
              raw_bytes="$(wc -c < "$wasm_file")"
              gz_bytes="$(gzip -c "$wasm_file" | wc -c)"
              limit_bytes=$((8 * 1024 * 1024))
              echo "wasm size: raw=${raw_bytes} bytes, gzip=${gz_bytes} bytes (limit=${limit_bytes} bytes)" | tee -a /tmp/ci.log
              if [ "$gz_bytes" -gt "$limit_bytes" ]; then
                echo "::error::gzip 後の wasm サイズ (${gz_bytes} bytes) が §18.1 の上限 8MiB (${limit_bytes} bytes) を超えています" | tee -a /tmp/ci.log
                status=1
              fi
            fi
          fi
          echo "::endgroup::"
          echo "::group::cargo check --target x86_64-pc-windows-msvc（生ログ）"
          cargo check --locked --target x86_64-pc-windows-msvc --features ui 2>&1 | tee -a /tmp/ci.log || status=$?
          echo "::endgroup::"
          if [ "$status" = 0 ] && grep -q -- '--> src/' /tmp/ci.log; then
            echo "::error::novnow の警告があります（上のログ）"
            status=1
          fi
          exit $status
      - name: Report to the run summary
        if: always() && steps.cargo.outcome != 'skipped'
        shell: bash
        env:
          CI_LOG: /tmp/ci.log
          CI_JOB: WASM Build Check
          CI_KIND: wasm
          CI_STATUS: ${{ steps.cargo.outcome }}
        run: python3 .github/report.py /tmp/body.md || echo "::warning::レポートの生成に失敗しました（合否には影響しません）"
      - name: Comment on the PR
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/body.md

  bench:
    name: Benchmarks
    needs: docs
    if: needs.docs.outputs.rust_changed == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_BENCH_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
      - name: cargo bench (§18.1 / §18.4)
        id: cargo
        shell: bash
        run: |
          set -o pipefail
          status=0
          echo "::group::cargo bench --no-run（生ログ）"
          cargo bench --locked --no-run 2>&1 | tee /tmp/ci.log || status=$?
          echo "::endgroup::"
          if [ "$status" = 0 ]; then
            echo "::group::cargo bench --bench core -- --quick（生ログ）"
            cargo bench --locked --bench core -- --quick 2>&1 | tee -a /tmp/ci.log || status=$?
            echo "::endgroup::"
          fi
          if [ "$status" = 0 ]; then
            echo "::group::typing and 1,000-idea navigation frame budgets (release, §18.1)"
            cargo test --locked --release --test editor_performance --features ui -- --nocapture 2>&1 | tee -a /tmp/ci.log || status=$?
            echo "::endgroup::"
          fi
          exit $status
      - name: Report to the run summary
        if: always() && steps.cargo.outcome != 'skipped'
        shell: bash
        env:
          CI_LOG: /tmp/ci.log
          CI_JOB: Benchmarks
          CI_KIND: wasm
          CI_STATUS: ${{ steps.cargo.outcome }}
        run: python3 .github/report.py /tmp/body.md || echo "::warning::レポートの生成に失敗しました（合否には影響しません）"
      - name: Comment on the PR
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/body.md
