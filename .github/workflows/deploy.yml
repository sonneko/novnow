name: Deploy to GitHub Pages

# One Pages deployment contains the website at /novnow/ and the app at /novnow/app/.
# main is release-only under GitFlow; feature branches never publish Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stable-pages-build
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      - name: Cache Trunk binary
        id: trunk-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/trunk
          key: trunk-v0.21.14-x86_64-unknown-linux-gnu

      - name: Download Trunk
        if: steps.trunk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xzf - -C "$HOME/.cargo/bin"
          trunk --version
      - name: Install wasm-bindgen-cli
        run: |
          set -euo pipefail
          version="$(awk -F '"' '/^name = "wasm-bindgen"/{f=1} f && /^version = /{print $2; exit}' Cargo.lock)"
          name="wasm-bindgen-${version}-x86_64-unknown-linux-musl"
          curl -fsSL --retry 3 "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${version}/${name}.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          install -m 755 "$RUNNER_TEMP/${name}/wasm-bindgen" "$HOME/.cargo/bin/wasm-bindgen"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            website/package-lock.json
            webui/package-lock.json
      - uses: actions/configure-pages@v5
      - name: Build the official website
        run: |
          python3 scripts/docs-site.py --check
          npm ci --prefix website
          npm run build --prefix website
      - name: Verify the website before combining it with the app
        run: |
          node --test website/integrations/base-links.test.mjs
          python3 scripts/website-check.py --website-only

      - name: Build with Trunk and Web UI
        run: |
          bash scripts/build-channel-browser.sh
          test ! -e website/dist/app
          cp -a dist website/dist/app
          cp -a dist website/dist/nightly-app
          npm ci --prefix webui
          bash scripts/webui-build.sh
          npm run build --prefix webui
          test ! -e website/dist/webui
          cp -a webui/dist website/dist/webui
          cp -a webui/dist website/dist/nightly-webui
          python3 scripts/website-check.py

      - run: mkdir -p payload && cp -a website/dist payload/site
      - uses: actions/upload-artifact@v7
        with:
          name: stable-site-payload
          path: payload
          if-no-files-found: error

  publish:
    needs: build
    uses: ./.github/workflows/channel-publish.yml
    with:
      channel: stable
      artifact: stable-site-payload
      sha: ${{ github.sha }}
