name: Deploy to GitHub Pages

# main ブランチのうち Web 版ビルドに影響するファイルが更新されたとき、または手動実行時のみ走らせる。
# ドキュメント（docs/**, README.md）や CLI 専用コード（src/cli/**）、テスト・ベンチマークのみの
# 変更では不要な WASM リリースビルドをスキップする。
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '!src/cli/**'
      - 'assets/**'
      - 'examples/sample-novel/**'
      - 'index.html'
      - 'Trunk.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      - name: Cache Trunk binary
        id: trunk-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/trunk
          key: trunk-v0.21.5-x86_64-unknown-linux-gnu

      - name: Download Trunk
        if: steps.trunk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/trunk-rs/trunk/releases/download/v0.21.5/trunk-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xzf - -C "$HOME/.cargo/bin"
          trunk --version

      - name: Build with Trunk
        run: |
          trunk build --release --public-url "/${{ github.event.repository.name }}/"

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
