name: Deploy to GitHub Pages

# 2026-10-13: **M7（GUI の内部 α、PLANS.md §5.8）までは手動実行だけ**にした（ユーザー指示）。
# M0 で v0 の UI を削除してから `trunk build` は通らず、main への push のたびに Pages の
# 実行が失敗していた（Actions の消費を減らす方針、PLANS.md §9.3）。M7 で GUI が戻ったら
# `push: branches: [main]` を戻す。
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Download Trunk
        run: |
          wget -qO- https://github.com/trunk-rs/trunk/releases/download/v0.21.5/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xzf-
          sudo mv trunk /usr/local/bin/
          trunk --version

      - name: Build with Trunk
        run: |
          trunk build --release --public-url "/${{ github.event.repository.name }}/"

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
