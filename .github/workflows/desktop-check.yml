name: Desktop artifacts

# Read-only release rehearsal: build and inspect archives, never publish or sign.
#
# CI スコープ（`CI_SCOPE`、docs/developers.md §4.7）:
# - main 向け PR・手動実行（scope=full が既定）= 10 構成すべて（5 対象環境 × gui/nogui）。
# - develop 向け PR・develop への push・手動実行（scope=develop）= Linux x64 の nogui 1 構成のみ
#   （GUI のコンパイル・リンクは ci.yml の clippy / test（--features ui）が担うため）。
# develop への push で報告するのは、必須チェックの平台行（desktop nogui）を
# develop 自身のコミットで満たすため（paths は PR と同じく付けない）。
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      scope:
        description: CI scope (full = release rehearsal, develop = single-platform minimal)
        type: choice
        options: [full, develop]
        default: full

permissions:
  contents: read

env:
  CI_SCOPE: ${{ github.event_name == 'workflow_dispatch' && (inputs.scope || 'full') || (github.event_name == 'pull_request' && (github.base_ref == 'main' && 'full' || 'develop')) || (github.ref_name == 'main' && 'full' || 'develop') }}

concurrency:
  group: desktop-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.matrix.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        run: echo "desktop=$(python3 scripts/release-matrix.py --desktop --scope "$CI_SCOPE")" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.desktop) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-check-${{ matrix.target }}-${{ matrix.gui }}
          cache-all-crates: true
      - name: Install Linux GUI build dependencies
        if: matrix.gui == 'gui' && contains(matrix.target, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev
      - name: Enable Intel executable smoke test on Apple Silicon
        if: matrix.target == 'x86_64-apple-darwin' && runner.arch == 'ARM64'
        run: sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license
      - name: Build, run CLI smoke checks, and verify the real archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          GUI: ${{ matrix.gui }}
          PYTHONUTF8: "1"
          CARGO_TERM_COLOR: never
        run: |
          set -o pipefail
          status=0
          bash scripts/desktop-check.sh 2>&1 | tee "$RUNNER_TEMP/desktop-check.log" || status=$?
          if [ "$status" != 0 ]; then
            python3 -c 'import os,pathlib; text=pathlib.Path(os.environ["RUNNER_TEMP"],"desktop-check.log").read_text()[-3000:]; print("::error::"+text.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
          fi
          exit "$status"
      - uses: actions/upload-artifact@v4
        with:
          name: checked-desktop-${{ matrix.target }}-${{ matrix.gui }}
          path: release-check/*
          retention-days: 7
