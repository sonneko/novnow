name: Pages integration

# Build and test only: no Pages deployment, registry publication, or environment.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

# CI スコープの判定は 4 ワークフロー（wheels / desktop-check / pages-check / vscode）
# で同一。docs/developers.md §4.7。
env:
  CI_SCOPE: ${{ github.event_name == 'workflow_dispatch' && 'full' || (github.event_name == 'pull_request' && (github.base_ref == 'main' && 'full' || 'develop')) || (github.ref_name == 'main' && 'full' || 'develop') }}

concurrency:
  group: pages-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      browsers: ${{ steps.scope.outputs.browsers }}
    steps:
      - name: Select the browser matrix by CI scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CI_SCOPE" = develop ]; then
            echo 'browsers={"browser":["chromium"]}' >> "$GITHUB_OUTPUT"
          else
            echo 'browsers={"browser":["chromium","firefox","webkit"]}' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build the same combined tree as Pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/trunk"
          curl -fsSL --retry 3 https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz | tar xzf - -C "$RUNNER_TEMP/trunk"
          python3 scripts/docs-site.py --check
          npm ci --prefix website
          npm run check:site --prefix website
          "$RUNNER_TEMP/trunk/trunk" build --release --public-url /novnow/app/
          cp -a dist website/dist/app
          python3 scripts/website-check.py
          ! grep -q 'const PRECACHE = null' website/dist/app/sw.js
      - uses: actions/upload-artifact@v4
        with:
          name: combined-pages
          path: website/dist
          retention-days: 7

  # ブラウザ行列は CI スコープで変わる（develop 向け PR は chromium のみ、
  # main 向け PR・push・手動実行は3種。docs/developers.md §4.7）。
  # 必須チェックの扱いは同様にブランチで違う: develop では chromium のみ必須、
  # main では3種すべて必須。ruleset 側の設定であり、正本は docs/distribution.md §8。
  browsers:
    needs: build
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    # playwright の --with-deps が入れる apt パッケージは Ubuntu 24.04 前提で確かめた構成。
    # ubuntu-latest が 26.04 へ移行したランナーではブラウザ導入が失敗したため固定する。
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.browsers) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: combined-pages
          path: website/dist
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.64.1-ubuntu24.04-${{ matrix.browser }}
      - name: Install Playwright
        run: npm install --prefix "$RUNNER_TEMP/browser" playwright@1.64.1
      # システム依存（apt）は毎回入れる。ブラウザ本体はキャッシュがあれば落とさない。
      # 導入が止まることがあるため上限と再試行を付け、失敗時はログの末尾を注釈へ出す
      # （この環境からは Actions の生ログが取れないため。vscode.yml の electron と同じ形）
      - name: Install browser system deps
        shell: bash
        run: |
          playwright_bin="$RUNNER_TEMP/browser/node_modules/.bin/playwright"
          ok=""
          for attempt in 1 2 3; do
            if timeout 420 "$playwright_bin" install-deps ${{ matrix.browser }} > "$RUNNER_TEMP/pw-deps.log" 2>&1; then ok=1; break; fi
            echo "install-deps attempt $attempt failed"
            sleep 20
          done
          if [ -z "$ok" ]; then
            node -e 'const fs=require("fs"); const text=fs.readFileSync(process.argv[1],"utf8").slice(-3000); console.log("::error::install-deps log: "+text.replace(/%/g,"%25").replace(/\r/g,"%0D").replace(/\n/g,"%0A"));' "$RUNNER_TEMP/pw-deps.log"
            cat "$RUNNER_TEMP/pw-deps.log"
            exit 1
          fi
      - name: Download the browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          playwright_bin="$RUNNER_TEMP/browser/node_modules/.bin/playwright"
          ok=""
          for attempt in 1 2 3; do
            if timeout 420 "$playwright_bin" install ${{ matrix.browser }} > "$RUNNER_TEMP/pw-install.log" 2>&1; then ok=1; break; fi
            echo "browser download attempt $attempt failed"
            sleep 20
          done
          if [ -z "$ok" ]; then
            node -e 'const fs=require("fs"); const text=fs.readFileSync(process.argv[1],"utf8").slice(-3000); console.log("::error::browser download log: "+text.replace(/%/g,"%25").replace(/\r/g,"%0D").replace(/\n/g,"%0A"));' "$RUNNER_TEMP/pw-install.log"
            cat "$RUNNER_TEMP/pw-install.log"
            exit 1
          fi
      - name: Install deterministic Firefox software graphics
        if: matrix.browser == 'firefox'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dri libglx-mesa0 libegl-mesa0 mesa-utils
          LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe xvfb-run -a glxinfo -B
      - name: Test website, real app, first offline boot and old worker migration
        env:
          NODE_DIR: ${{ runner.temp }}/browser
          BROWSER: ${{ matrix.browser }}
        shell: bash
        run: |
          set -o pipefail
          status=0
          repetitions=1
          if [ "$BROWSER" = firefox ]; then repetitions=5; fi
          for iteration in $(seq 1 "$repetitions"); do
            echo "$BROWSER clean-profile run $iteration/$repetitions"
            xvfb-run -a node scripts/pages-e2e.mjs 2>&1 | tee "$RUNNER_TEMP/pages-e2e.log" || status=$?
            if [ "$status" != 0 ]; then break; fi
          done
          if [ "$status" != 0 ]; then
            node -e 'const fs=require("fs"); const text=fs.readFileSync(process.env.RUNNER_TEMP+"/pages-e2e.log","utf8").slice(-3000); console.log("::error::"+text.replace(/%/g,"%25").replace(/\r/g,"%0D").replace(/\n/g,"%0A"));'
          fi
          exit "$status"

  crate:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check the real crates.io package without publishing
        run: cargo publish --locked --dry-run
