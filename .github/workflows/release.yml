name: Release

# Full distribution is intentionally limited to immutable version tags and
# explicit manual runs. Pull requests use the ordinary CI / wheels workflows.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_testpypi:
        description: Publish the five wheels to TestPyPI
        type: boolean
        default: false
      publish_pypi:
        description: Publish the five wheels to PyPI (requires pypi approval)
        type: boolean
        default: false
      publish_vscode:
        description: Publish the extension to the marketplace (requires vscode approval)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      desktop: ${{ steps.meta.outputs.desktop }}
      wheels: ${{ steps.meta.outputs.wheels }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH_TESTPYPI: ${{ inputs.publish_testpypi }}
          PUBLISH_PYPI: ${{ inputs.publish_pypi }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/release-matrix.py --check
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          tag="v$version"
          if [ "$EVENT_NAME" = push ]; then
            tag="$REF_NAME"
            if [ "$tag" != "v$version" ]; then
              echo "::error::tag $tag does not match Cargo.toml version $version"
              exit 1
            fi
          elif [ "$PUBLISH_PYPI" = true ] && [ "$PUBLISH_TESTPYPI" != true ]; then
            echo "::error::PyPI publication requires the TestPyPI gate in the same run"
            exit 1
          fi
          if gh release view "$tag" --json assets --jq '.assets | length' 2>/dev/null | grep -Eq '^[1-9][0-9]*$'; then
            echo "::error::release $tag already has artifacts; published artifacts are immutable"
            exit 1
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "desktop=$(python3 scripts/release-matrix.py --desktop)"
            echo "wheels=$(python3 scripts/release-matrix.py --wheels)"
          } >> "$GITHUB_OUTPUT"

  desktop:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.desktop) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
      - name: Install native GUI build dependencies
        if: matrix.gui == 'gui' && contains(matrix.target, 'linux')
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev
      - name: Build desktop executable
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          FEATURES: ${{ matrix.features }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [ -n "$FEATURES" ]; then
            cargo build --locked --release --target "$TARGET" --features "$FEATURES"
          else
            cargo build --locked --release --target "$TARGET"
          fi
      - name: Sign Windows executable when a certificate is configured
        if: contains(matrix.target, 'windows')
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:WINDOWS_CERTIFICATE_BASE64)) {
            Write-Host "Windows signing not configured; leaving this executable unsigned."
            exit 0
          }
          $certificate = Join-Path $env:RUNNER_TEMP "novnow-signing.pfx"
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe was not found" }
          & $signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $certificate /p $env:WINDOWS_CERTIFICATE_PASSWORD "target/$env:TARGET/release/novnow.exe"
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
          Remove-Item $certificate -Force
      - name: Prepare macOS app bundle
        if: contains(matrix.target, 'apple') && matrix.gui == 'gui'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release-matrix.py --bundle-macos \
            --binary "target/${{ matrix.target }}/release/novnow" \
            --output "$RUNNER_TEMP/novnow.app"
      - name: Sign and notarize macOS output when credentials are configured
        if: contains(matrix.target, 'apple')
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          GUI: ${{ matrix.gui }}
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_CERTIFICATE_NAME: ${{ secrets.MACOS_CERTIFICATE_NAME }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "$MACOS_CERTIFICATE_BASE64" ]; then
            echo "macOS signing/notarization not configured; leaving this output unsigned."
            exit 0
          fi
          certificate="$RUNNER_TEMP/novnow-signing.p12"
          keychain="$RUNNER_TEMP/novnow-signing.keychain-db"
          python3 -c 'import base64,os; open(os.environ["RUNNER_TEMP"]+"/novnow-signing.p12","wb").write(base64.b64decode(os.environ["MACOS_CERTIFICATE_BASE64"]))'
          security create-keychain -p "$MACOS_CERTIFICATE_PASSWORD" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$MACOS_CERTIFICATE_PASSWORD" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MACOS_CERTIFICATE_PASSWORD" "$keychain"
          if [ "$GUI" = gui ]; then
            codesign --deep --force --options runtime --keychain "$keychain" --sign "$MACOS_CERTIFICATE_NAME" "$RUNNER_TEMP/novnow.app"
          else
            codesign --force --options runtime --keychain "$keychain" --sign "$MACOS_CERTIFICATE_NAME" "target/$TARGET/release/novnow"
          fi
          rm -f "$certificate"
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            if [ "$GUI" = gui ]; then
              (cd "$RUNNER_TEMP" && ditto -c -k --keepParent novnow.app novnow-notary.zip)
              xcrun notarytool submit "$RUNNER_TEMP/novnow-notary.zip" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
              xcrun stapler staple "$RUNNER_TEMP/novnow.app"
            else
              (cd "target/$TARGET/release" && zip -q "$RUNNER_TEMP/novnow-notary.zip" novnow)
              xcrun notarytool submit "$RUNNER_TEMP/novnow-notary.zip" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            fi
          else
            echo "Notarization credentials are absent; the signed output is not notarized."
          fi
      - name: Package and verify archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          args=(--package --target "${{ matrix.target }}" --gui "${{ matrix.gui }}" --output "release/${{ matrix.artifact }}")
          if [ "${{ matrix.gui }}" = gui ] && [[ "${{ matrix.target }}" == *apple* ]]; then
            args+=(--app "$RUNNER_TEMP/novnow.app")
          elif [[ "${{ matrix.target }}" == *windows* ]]; then
            args+=(--binary "target/${{ matrix.target }}/release/novnow.exe")
          else
            args+=(--binary "target/${{ matrix.target }}/release/novnow")
          fi
          python3 scripts/release-matrix.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}-${{ matrix.gui }}
          path: release/${{ matrix.artifact }}
          if-no-files-found: error

  wheels:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.wheels) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: python/novnow-py
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Prepare Rosetta for the Intel macOS Python
        if: matrix.target == 'x86_64-apple-darwin' && runner.arch == 'ARM64'
        run: sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.python_arch }}
      - name: Build manylinux wheel
        if: contains(matrix.target, 'linux')
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --locked --release --target ${{ matrix.target }} --out dist --manylinux 2_28
          working-directory: python/novnow-py
      - name: Build macOS or Windows wheel
        if: ${{ !contains(matrix.target, 'linux') }}
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --locked --release --target ${{ matrix.target }} --out dist
          working-directory: python/novnow-py
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
      - name: Verify generated wheel filename
        shell: bash
        run: |
          set -euo pipefail
          test -f "dist/${{ matrix.artifact }}" || {
            echo "::error::expected dist/${{ matrix.artifact }}"
            ls -l dist
            exit 1
          }
      - name: Install and import this target's wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --force-reinstall "dist/${{ matrix.artifact }}"
          python -c 'import novnow,os,tomllib; expected=tomllib.load(open(os.path.join(os.environ["GITHUB_WORKSPACE"],"Cargo.toml"),"rb"))["package"]["version"]; assert novnow.__version__ == expected; assert novnow.operations(); print(novnow.__version__, len(novnow.operations()))'
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: python/novnow-py/dist/${{ matrix.artifact }}
          if-no-files-found: error

  wheel-test:
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: wheel-x86_64-unknown-linux-gnu
          path: dist
      - name: Install, verify version, and run Python tests
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip pytest
          python -m pip install dist/*.whl
          python -c 'import novnow,tomllib; expected=tomllib.load(open("Cargo.toml","rb"))["package"]["version"]; assert novnow.__version__ == expected, (novnow.__version__, expected); print(novnow.__version__, len(novnow.operations()))'
          pytest python/novnow-py

  stage-artifacts:
    needs: [prepare, desktop, wheel-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: release
          merge-multiple: true
      - name: Verify and publish desktop plus wheel artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/release-matrix.py --checksums release
          bash scripts/release-check.sh --dir release --artifacts-only
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "novnow $VERSION" --notes "novnow $VERSION distribution artifacts" "${prerelease[@]}"
          fi
          gh release upload "$TAG" release/*

  publish-testpypi:
    needs: stage-artifacts
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_testpypi)
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: publish-testpypi
    if: always() && github.event_name == 'workflow_dispatch' && inputs.publish_pypi && needs.publish-testpypi.result == 'success'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  vscode-package:
    needs: [prepare, stage-artifacts, publish-testpypi, publish-pypi]
    if: always() && needs.prepare.result == 'success' && needs.stage-artifacts.result == 'success' && needs.publish-testpypi.result != 'failure' && needs.publish-testpypi.result != 'cancelled' && needs.publish-pypi.result != 'failure' && needs.publish-pypi.result != 'cancelled'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: vscode
          path: vscode/novnow-${{ needs.prepare.outputs.version }}.vsix
          if-no-files-found: error

  publish-vscode:
    needs: vscode-package
    if: github.event_name == 'workflow_dispatch' && inputs.publish_vscode
    runs-on: ubuntu-latest
    environment: vscode
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Publish sonneko.novnow to the marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --no-dependencies

  finalize:
    needs: [prepare, vscode-package, publish-vscode]
    if: always() && needs.prepare.result == 'success' && needs.vscode-package.result == 'success' && needs.publish-vscode.result != 'failure' && needs.publish-vscode.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: vscode
          path: release
      - name: Add VSIX, regenerate SHA256SUMS, and verify all 16 files
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
        run: |
          set -euo pipefail
          note="Windows and macOS signing credentials were configured; see the platform job logs for signing/notarization status."
          if [ -z "$WINDOWS_CERTIFICATE_BASE64" ] && [ -z "$MACOS_CERTIFICATE_BASE64" ]; then
            note="Windows and macOS signing keys were not configured; those executables are unsigned."
          elif [ -z "$WINDOWS_CERTIFICATE_BASE64" ] || [ -z "$MACOS_CERTIFICATE_BASE64" ]; then
            note="One or more platforms did not have signing keys configured; see the platform job logs for unsigned artifacts."
          fi
          python3 scripts/release-matrix.py --checksums release --signature-note "$note"
          bash scripts/release-check.sh --dir release
          gh release upload "$TAG" release/*.vsix
          gh release upload "$TAG" release/SHA256SUMS --clobber

  action-tags:
    needs: [prepare, finalize]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish immutable version and moving v1 action tags
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: bash scripts/release-tags.sh --publish --version "$VERSION" --sha "$GITHUB_SHA"

  release-check:
    needs: action-tags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: vscode
          path: release
      - name: Rebuild the verified manifest and check local files and remote tags
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/release-matrix.py --checksums release
          bash scripts/release-check.sh --dir release --remote
