name: sandbox-tools

# 目的（Web 版をブラウザで確かめるための道具や追加クレートを git blob に退避する）
# ---------------------------------------------------------------------
# Arena の開発サンドボックスからは GitHub のリリースの asset（objects.githubusercontent.com）や
# static.crates.io に届かないため、必要なアーカイブをここで取得して git blob として保存し、
# その SHA を PR にコメントする（取り出しは scripts/web-smoke.sh / scripts/bootstrap-toolchain.sh）。
#
# 走るのは `.github/sandbox-tools.env` を `ENABLED=1` にして push したとき、または手動実行時のみ。

on:
  workflow_dispatch:
  push:
    branches:
      - "arena/**"
    paths:
      - .github/sandbox-tools.env

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sandbox-tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wasm-bindgen:
    name: wasm-bindgen CLI to a git blob
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: fetch, store as a blob, comment
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          . ./.github/sandbox-tools.env
          if [ "${ENABLED:-0}" != "1" ] && [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]; then
            echo "ENABLED=0 のためスキップします。"
            exit 0
          fi
          version="$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)"
          name="wasm-bindgen-${version}-x86_64-unknown-linux-musl"
          curl -fsSL --retry 3 -o tool.tar.gz \
            "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${version}/${name}.tar.gz"
          sha="$(sha256sum tool.tar.gz | cut -d' ' -f1)"
          python3 - <<'PY'
          import base64, json
          data = base64.b64encode(open("tool.tar.gz", "rb").read()).decode()
          json.dump({"content": data, "encoding": "base64"}, open("blob.json", "w"))
          PY
          blob="$(gh api -X POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input blob.json --jq .sha)"
          pr="$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${GITHUB_REF_NAME}" --state all --json number --jq '.[0].number')"
          body="sandbox-tools: wasm-bindgen=${version} blob=${blob} sha256=${sha} file=${name}.tar.gz"
          echo "$body"
          echo "$body" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$pr" ]; then
            gh pr comment "$pr" --repo "${GITHUB_REPOSITORY}" --body "$body"
          fi

  japanese-crates:
    name: tiniestsegmenter .crate to a git blob
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: fetch, store as a blob, comment
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          . ./.github/sandbox-tools.env
          if [ "${ENABLED:-0}" != "1" ] && [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]; then
            echo "ENABLED=0 のためスキップします。"
            exit 0
          fi
          mkdir -p crates
          # S-09 / F-23（簡易形態素解析）で使うクレート。依存は無い（純 Rust・モデル同梱）。
          for item in \
            tiniestsegmenter:0.3.0
          do
            name="${item%:*}"
            ver="${item#*:}"
            curl -fsSL --retry 3 -o "crates/${name}-${ver}.crate" \
              "https://static.crates.io/crates/${name}/${name}-${ver}.crate"
          done
          tar czf japanese-crates.tar.gz crates
          sha="$(sha256sum japanese-crates.tar.gz | cut -d' ' -f1)"
          python3 - <<'PY'
          import base64, json
          data = base64.b64encode(open("japanese-crates.tar.gz", "rb").read()).decode()
          json.dump({"content": data, "encoding": "base64"}, open("blob.json", "w"))
          PY
          blob="$(gh api -X POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input blob.json --jq .sha)"
          pr="$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${GITHUB_REF_NAME}" --state all --json number --jq '.[0].number')"
          body="sandbox-tools: japanese-crates=tiniestsegmenter-0.3.0 blob=${blob} sha256=${sha} file=japanese-crates.tar.gz"
          echo "$body"
          echo "$body" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$pr" ]; then
            gh pr comment "$pr" --repo "${GITHUB_REPOSITORY}" --body "$body"
          fi

  encoding-crate:
    name: encoding_rs .crate to a git blob
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: fetch, store as a blob, comment
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          . ./.github/sandbox-tools.env
          if [ "${ENABLED:-0}" != "1" ] && [ "${ENCODING_RS:-0}" != "1" ] && [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]; then
            echo "ENABLED=0 / ENCODING_RS=0 のためスキップします。"
            exit 0
          fi
          mkdir -p crates
          # Issue #29 X1（移行支援の Shift_JIS 読み替え、§14.6）で使うクレート。依存なしの構成で使う。
          # 版は sparse index から 0.8 系の最新（yank されていないもの）を決定的に選び、cksum で照合する。
          curl -fsSL --retry 3 -o encoding_rs.index "https://index.crates.io/en/co/encoding_rs"
          python3 - <<'PY'
          import json
          best = None
          for line in open("encoding_rs.index"):
              if not line.strip():
                  continue
              row = json.loads(line)
              if row.get("yanked"):
                  continue
              parts = row["vers"].split(".")
              if len(parts) == 3 and parts[0] == "0" and parts[1] == "8" and parts[2].isdigit():
                  key = int(parts[2])
                  if best is None or key > best[0]:
                      best = (key, row["vers"], row.get("cksum", ""))
          assert best is not None
          open("encoding_rs.version", "w").write(best[1] + " " + best[2])
          PY
          read -r version cksum < encoding_rs.version
          curl -fsSL --retry 3 -o "crates/encoding_rs-${version}.crate" \
            "https://static.crates.io/crates/encoding_rs/encoding_rs-${version}.crate"
          echo "${cksum}  crates/encoding_rs-${version}.crate" | sha256sum -c -
          tar czf encoding-crate.tar.gz crates
          sha="$(sha256sum encoding-crate.tar.gz | cut -d' ' -f1)"
          python3 - <<'PY'
          import base64, json
          data = base64.b64encode(open("encoding-crate.tar.gz", "rb").read()).decode()
          json.dump({"content": data, "encoding": "base64"}, open("blob.json", "w"))
          PY
          blob="$(gh api -X POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input blob.json --jq .sha)"
          pr="$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${GITHUB_REF_NAME}" --state all --json number --jq '.[0].number')"
          body="sandbox-tools: encoding-crate=encoding_rs-${version} blob=${blob} sha256=${sha} file=encoding-crate.tar.gz"
          echo "$body"
          echo "$body" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$pr" ]; then
            gh pr comment "$pr" --repo "${GITHUB_REPOSITORY}" --body "$body"
          fi

  criterion-crates:
    name: criterion .crate files to a git blob
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: fetch .crate files, store as a blob, comment
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          . ./.github/sandbox-tools.env
          if [ "${ENABLED:-0}" != "1" ] && [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]; then
            echo "ENABLED=0 のためスキップします。"
            exit 0
          fi
          mkdir -p crates
          for item in \
            anes:0.1.6 \
            anstyle:1.0.14 \
            cast:0.3.0 \
            ciborium:0.2.2 \
            ciborium-io:0.2.2 \
            ciborium-ll:0.2.2 \
            clap:4.6.7 \
            clap_builder:4.6.7 \
            clap_lex:1.0.1 \
            criterion:0.5.1 \
            criterion-plot:0.5.0 \
            crunchy:0.2.4 \
            either:1.15.0 \
            half:2.4.1 \
            is-terminal:0.4.17 \
            itertools:0.10.5 \
            num-traits:0.2.19 \
            oorandom:11.1.5 \
            tinytemplate:1.1.0
          do
            name="${item%:*}"
            ver="${item#*:}"
            curl -fsSL --retry 3 -o "crates/${name}-${ver}.crate" \
              "https://static.crates.io/crates/${name}/${name}-${ver}.crate"
          done
          tar czf criterion-crates.tar.gz crates
          sha="$(sha256sum criterion-crates.tar.gz | cut -d' ' -f1)"
          python3 - <<'PY'
          import base64, json
          data = base64.b64encode(open("criterion-crates.tar.gz", "rb").read()).decode()
          json.dump({"content": data, "encoding": "base64"}, open("blob.json", "w"))
          PY
          blob="$(gh api -X POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input blob.json --jq .sha)"
          pr="$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${GITHUB_REF_NAME}" --state all --json number --jq '.[0].number')"
          body="sandbox-tools: criterion-crates=0.5.1 blob=${blob} sha256=${sha} file=criterion-crates.tar.gz"
          echo "$body"
          echo "$body" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$pr" ]; then
            gh pr comment "$pr" --repo "${GITHUB_REPOSITORY}" --body "$body"
          fi

  pyo3-crates:
    name: pyo3 vendored sources to a git blob
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: fetch pyo3 + deps, store as a blob, comment
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          . ./.github/sandbox-tools.env
          if [ "${ENABLED:-0}" != "1" ] && [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]; then
            echo "ENABLED=0 のためスキップします。"
            exit 0
          fi
          # 段階③ H6（§19.3 Python API）の PyO3 系クレート。バージョンはここで解決して
          # ログに残す（サンドボックスからは crates.io の索引に届かないため）。
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          # shellcheck source=/dev/null
          . "$HOME/.cargo/env"
          # 版本は `python/novnow-py/Cargo.toml` から読む（ここで別々に書くとずれる）
          pyo3_req="$(awk -F'"' '/^pyo3 = \{ version =/ { print $2; exit }' python/novnow-py/Cargo.toml)"
          if [ -z "$pyo3_req" ]; then
            echo "::error::python/novnow-py/Cargo.toml から pyo3 の版本を読めません"
            exit 1
          fi
          echo "python/novnow-py が要求する pyo3: $pyo3_req"
          mkdir -p /tmp/probe/src
          printf 'fn main() {}\n' > /tmp/probe/src/main.rs
          cat > /tmp/probe/Cargo.toml <<TOML
          [package]
          name = "pyo3-probe"
          version = "0.0.0"
          edition = "2021"

          [dependencies]
          pyo3 = { version = "$pyo3_req", features = ["extension-module", "abi3-py39"] }
          TOML
          cd /tmp/probe
          cargo generate-lockfile
          pyo3_version="$(awk '/^name = "pyo3"$/ { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)"
          cargo vendor /tmp/pyo3-vendor >/dev/null
          cd /tmp/pyo3-vendor
          tar czf /tmp/pyo3-crates.tar.gz .
          sha="$(sha256sum /tmp/pyo3-crates.tar.gz | cut -d' ' -f1)"
          python3 - <<'PY'
          import base64, json
          data = base64.b64encode(open("/tmp/pyo3-crates.tar.gz", "rb").read()).decode()
          json.dump({"content": data, "encoding": "base64"}, open("/tmp/blob.json", "w"))
          PY
          blob="$(gh api -X POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input /tmp/blob.json --jq .sha)"
          # 孤立ブランチ cache/pyo3-crates にも置く（サンドボックスからは api.github.com 経由の
          # blob 取得も git fetch もできるが、blob SHA をログから拾えないため branch を正本にする）。
          #
          # push は**使い捨ての空リポジトリ**から行う（`REF:.github/workflows/toolchain-export.yml`
          # の 04 / 09 と同じ、実績のあるやり方）。チェックアウト先で `git checkout --orphan`
          # する書き方は 2 つの問題がある: 直前までの `cd /tmp/probe` → `cd /tmp/pyo3-vendor`
          # で `git config` が `fatal: not in a git directory`（exit 128）になる（2026-10-22 の
          # 失敗の実因）こと、戻っても fetch-depth: 1 の shallow clone からの orphan push になること。
          payload="$(mktemp -d)"
          cp /tmp/pyo3-crates.tar.gz "$payload/"
          echo "$sha  pyo3-crates.tar.gz" > "$payload/SHA256SUMS"
          echo "$pyo3_version" > "$payload/PYO3_VERSION"
          ls -1 /tmp/pyo3-vendor > "$payload/CRATES"
          cd "$payload"
          git init -q -b cache/pyo3-crates
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000
          git config http.version HTTP/1.1
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add -A
          git commit -q -m "cache: pyo3 vendored sources (${pyo3_version})"
          git push -q -f origin cache/pyo3-crates
          echo "pushed cache/pyo3-crates (${pyo3_version}, $(du -h pyo3-crates.tar.gz | cut -f1))"
          pr="$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${GITHUB_REF_NAME}" --state all --json number --jq '.[0].number')"
          body="sandbox-tools: pyo3-crates=${pyo3_version} blob=${blob} sha256=${sha} file=pyo3-crates.tar.gz branch=cache/pyo3-crates"
          echo "$body"
          echo "$body" >> "$GITHUB_STEP_SUMMARY"
          ls /tmp/pyo3-vendor | tr '\n' ' ' >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$pr" ]; then
            gh pr comment "$pr" --repo "${GITHUB_REPOSITORY}" --body "$body"
          fi
