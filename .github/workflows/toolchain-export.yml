name: toolchain-export

# 目的（PLANS.md §9.3「開発環境に Rust ツールチェーンが無い」への対策）
# ---------------------------------------------------------------------
# Arena の開発サンドボックスには cargo / rustc / rustup が無く、許可ホストは
# github.com・codeload.github.com・api.github.com・registry.npmjs.org・pypi.org 系だけ。
# static.rust-lang.org（rustup の配布先）と crates.io に到達できないので、
# ツールチェーンを自分で用意できない。
#
# そこで Actions 側で
#   1. rustup の sysroot 一式（rustc / cargo / rust-std / rustfmt / clippy）
#   2. `cargo vendor` した依存クレートのソース
# を tar.gz にして 90MB ずつに分割し、孤立ブランチ cache/rust-toolchain に commit する。
# サンドボックス側は codeload.github.com から一括で取り出す（実測 4.7MB を 0.7 秒）。
#
# 実行環境は **debian:12 コンテナ**＝サンドボックスと同一 OS（glibc 2.36 / OpenSSL 3）。
# 「同梱物だけでビルド＆テストが通った」ことを push 前に確認するので、glibc や
# libstdc++ のバージョン違いで向こうが動かない、という事故が起きない。
#
# Actions のログはサンドボックスから読めない（ログ取得先ホストに到達できない）ため、
# ビルドログも BUILD-LOG.txt として同じブランチに push する（失敗時も push する）。
#
# 挙動はすべて .github/toolchain.env が制御する（YAML を触らずに再実行・無効化できる）。
# 不要になったらそのファイルを ENABLED=0 にするか削除し、
#   git push origin --delete cache/rust-toolchain
# で生成物ブランチも消すこと。

on:
  workflow_dispatch:
  push:
    branches:
      - arena/acb80002-novnow
    paths:
      - .github/workflows/toolchain-export.yml
      - .github/toolchain.env

permissions:
  contents: write

concurrency:
  group: toolchain-export
  cancel-in-progress: false

env:
  DEBIAN_FRONTEND: noninteractive
  RUSTUP_HOME: /tmp/rustup
  CARGO_HOME: /tmp/cargo
  PAYLOAD: /tmp/payload
  VERIFY: /tmp/verify
  LOG: /tmp/build.log
  PROGRESS: /tmp/progress

jobs:
  export:
    name: export toolchain to the cache branch
    runs-on: ubuntu-latest
    container: debian:12
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 01 base packages
        shell: bash
        run: |
          echo "STEP 01 base packages" >> "$PROGRESS"
          exec >> "$LOG" 2>&1
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            git curl ca-certificates pigz python3 > /dev/null
          echo "--- runner environment ---"
          uname -a
          head -2 /etc/os-release
          ldd --version | head -1
          echo "cpus=$(nproc) mem=$(free -m | awk '/^Mem:/{print $2}')MB"
          git --version
          curl --version | head -1

      - name: 02 checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 03 config and skip check
        shell: bash
        run: |
          echo "STEP 03 config and skip check" >> "$PROGRESS"
          exec >> "$LOG" 2>&1
          set -euo pipefail
          set -a
          # shellcheck source=/dev/null
          . ./.github/toolchain.env
          set +a
          # 以降のステップ（と if: env.XXX）から参照できるよう GITHUB_ENV に写す。
          for v in ENABLED CACHE_BRANCH CHUNK_MB TOOLCHAIN PROFILE COMPONENTS \
                   VENDOR SMOKE SMOKE_CMD SALT FORCE; do
            printf '%s=%s\n' "$v" "${!v}" >> "$GITHUB_ENV"
          done
          echo "--- toolchain.env ---"
          cat ./.github/toolchain.env
          if [ "$ENABLED" != "1" ]; then
            echo "ENABLED=0 なので何もしない。"
            echo "SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          CACHE_KEY="$(cat ./.github/toolchain.env ./rust-toolchain.toml ./Cargo.lock \
            | sha256sum | cut -c1-16)-$SALT"
          echo "CACHE_KEY=$CACHE_KEY" >> "$GITHUB_ENV"
          echo "cache_key=$CACHE_KEY"
          code=$(curl -sS -o /tmp/remote-manifest.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/MANIFEST.json?ref=$CACHE_BRANCH" \
            || true)
          echo "remote MANIFEST.json http=$code"
          if [ "$code" = "200" ]; then
            cat /tmp/remote-manifest.json
            remote_key=$(python3 -c 'import json;print(json.load(open("/tmp/remote-manifest.json")).get("cache_key",""))')
            if [ "$remote_key" = "$CACHE_KEY" ] && [ "$FORCE" != "1" ]; then
              echo "同じ cache_key の生成物が既にあるので何もしない（FORCE=1 で強制再生成）。"
              echo "SKIP=1" >> "$GITHUB_ENV"
            fi
          fi

      # 先に 3MB の検証用ファイルを push しておく。サンドボックス側は重い生成物を
      # 待たずに「取り出し経路が使えるか」を数分で検証できる。
      - name: 04 push probe
        if: env.SKIP != '1'
        shell: bash
        run: |
          echo "STEP 04 push probe" >> "$PROGRESS"
          exec >> "$LOG" 2>&1
          set -euo pipefail
          rm -rf "$PAYLOAD"
          mkdir -p "$PAYLOAD/probe"
          head -c 3145728 /dev/urandom > "$PAYLOAD/probe/probe-3mb.bin"
          sha256sum "$PAYLOAD/probe/probe-3mb.bin" | cut -d' ' -f1 \
            > "$PAYLOAD/probe/probe-3mb.sha256"
          date -u +"probe pushed at %FT%TZ run=${GITHUB_RUN_ID}" > "$PAYLOAD/probe/hello.txt"
          printf '{"status":"probe","cache_key":"%s"}\n' "$CACHE_KEY" > "$PAYLOAD/MANIFEST.json"
          cp "$LOG" "$PAYLOAD/BUILD-LOG.txt"
          cd "$PAYLOAD"
          git init -q -b "$CACHE_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000
          git config http.version HTTP/1.1
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add -A
          git commit -q -m "toolchain-export: probe ($CACHE_KEY)"
          git push -q -f origin "$CACHE_BRANCH"
          echo "probe pushed to $CACHE_BRANCH"

      - name: 05 install rust toolchain
        if: env.SKIP != '1'
        shell: bash
        run: |
          echo "STEP 05 install rust toolchain" >> "$PROGRESS"
          exec >> "$LOG" 2>&1
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --no-modify-path --profile minimal --default-toolchain none
          export PATH="$CARGO_HOME/bin:$PATH"
          # rust-toolchain.toml（wasm32 ターゲット込み）ではなく CI と同じ構成だけを入れる。
          export RUSTUP_TOOLCHAIN="$TOOLCHAIN"
          echo "RUSTUP_TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
          args=()
          IFS=',' read -ra comps <<< "$COMPONENTS"
          for c in "${comps[@]}"; do
            [ -n "$c" ] && args+=(--component "$c")
          done
          rustup toolchain install "$TOOLCHAIN" --profile "$PROFILE" "${args[@]}"
          rustup show
          echo "rustc  : $(rustc -V)"
          echo "cargo  : $(cargo -V)"
          echo "rustfmt: $(rustfmt -V)"
          echo "clippy : $(cargo clippy -V)"
          SYSROOT=$(rustc --print sysroot)
          echo "SYSROOT=$SYSROOT"
          echo "SYSROOT=$SYSROOT" >> "$GITHUB_ENV"
          du -sh "$SYSROOT"
          du -sh "$SYSROOT"/* 2>/dev/null || true
          mkdir -p "$PAYLOAD"
          {
            echo "# ldd of the packaged binaries (debian:12 container)"
            for b in rustc cargo rustfmt clippy-driver; do
              echo "## $b"
              ldd "$SYSROOT/bin/$b" 2>&1 || true
            done
            echo "## librustc_driver"
            ldd "$SYSROOT"/lib/librustc_driver-*.so 2>&1 || true
          } > "$PAYLOAD/ENV-INFO.txt"
          cat "$PAYLOAD/ENV-INFO.txt"

      - name: 06 pack sysroot
        if: env.SKIP != '1'
        shell: bash
        run: |
          echo "STEP 06 pack sysroot" >> "$PROGRESS"
          exec >> "$LOG" 2>&1
          set -euo pipefail
          cd "$SYSROOT"
          du -sh ./lib/rustlib/src ./share 2>/dev/null || true
          tar \
            --exclude='./lib/rustlib/src' \
            --exclude='./lib/rustlib/*/analysis' \
            --exclude='./share/doc' \
            --exclude='./share/man' \
            -I pigz -cf "$PAYLOAD/sysroot.tar.gz" .
          ls -l "$PAYLOAD/sysroot.tar.gz"

      - name: 07 vendor dependencies
        if: env.SKIP != '1' && env.VENDOR == '1'
        shell: bash
        run: |
          echo "STEP 07 vendor dependencies" >> "$PROGRESS"
          exec >> "$LOG" 2>&1
          set -euo pipefail
          export PATH="$CARGO_HOME/bin:$PATH"
          cd "$GITHUB_WORKSPACE"
          cargo vendor --locked "$PAYLOAD/vendor-src" > "$PAYLOAD/vendor-config.toml"
          cat "$PAYLOAD/vendor-config.toml"
          echo "crates=$(find "$PAYLOAD/vendor-src" -maxdepth 1 -mindepth 1 -type d | wc -l)"
          du -sh "$PAYLOAD/vendor-src"
          cd "$PAYLOAD"
          tar -I pigz -cf vendor.tar.gz vendor-src vendor-config.toml
          rm -rf vendor-src
          ls -l vendor.tar.gz

      # 同梱物「だけ」で実際にビルド＆テストする。ここで緑ならサンドボックスでも動く。
      - name: 08 smoke test the payload
        if: env.SKIP != '1' && env.SMOKE == '1'
        shell: bash
        run: |
          echo "STEP 08 smoke test" >> "$PROGRESS"
          exec >> "$LOG" 2>&1
          set -euo pipefail
          mkdir -p "$VERIFY/sysroot" "$VERIFY/vendor" "$VERIFY/cargo-home"
          tar -xzf "$PAYLOAD/sysroot.tar.gz" -C "$VERIFY/sysroot"
          if [ -f "$PAYLOAD/vendor.tar.gz" ]; then
            tar -xzf "$PAYLOAD/vendor.tar.gz" -C "$VERIFY/vendor"
          fi
          cat > "$VERIFY/cargo-home/config.toml" <<EOF
          [source.crates-io]
          replace-with = "vendored-sources"

          [source.vendored-sources]
          directory = "$VERIFY/vendor/vendor-src"

          [net]
          offline = true
          EOF
          export PATH="$VERIFY/sysroot/bin:$PATH"
          export RUSTC="$VERIFY/sysroot/bin/rustc"
          export CARGO_HOME="$VERIFY/cargo-home"
          unset RUSTUP_TOOLCHAIN
          echo "extracted sysroot: $(du -sh "$VERIFY/sysroot" | cut -f1)"
          echo "rustc  : $(rustc -V)"
          echo "cargo  : $(cargo -V)  ($(command -v cargo))"
          echo "rustfmt: $(rustfmt -V)"
          echo "clippy : $(cargo clippy -V)"
          ldd "$(command -v cargo)"
          cd "$GITHUB_WORKSPACE"
          rm -rf target
          echo "--- SMOKE_CMD: $SMOKE_CMD ---"
          start=$(date +%s)
          $SMOKE_CMD
          echo "smoke test passed in $(( $(date +%s) - start ))s on $(nproc) cpus" \
            > /tmp/smoke-result.txt
          cat /tmp/smoke-result.txt

      - name: 09 chunk, manifest, push
        if: env.SKIP != '1'
        shell: bash
        run: |
          echo "STEP 09 chunk, manifest, push" >> "$PROGRESS"
          exec >> "$LOG" 2>&1
          set -euo pipefail
          cd "$PAYLOAD"
          rm -rf chunks
          mkdir -p chunks
          for f in *.tar.gz; do
            split -b "$((CHUNK_MB * 1024 * 1024))" -d -a 3 "$f" "chunks/$f."
          done
          sha256sum ./*.tar.gz > SHA256SUMS
          cat SHA256SUMS
          ls -l chunks
          cp "${SMOKE_RESULT:-/tmp/smoke-result.txt}" "$PAYLOAD/SMOKE-RESULT.txt" 2>/dev/null \
            || echo "smoke test did not run" > "$PAYLOAD/SMOKE-RESULT.txt"
          cp "$LOG" /tmp/log-snapshot.txt
          python3 - <<'PY'
          import hashlib, json, os, time

          payload = os.environ["PAYLOAD"]
          token = os.environ.get("GH_TOKEN", "")

          def sha256(path):
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for block in iter(lambda: f.read(1 << 20), b""):
                      h.update(block)
              return h.hexdigest()

          files = {}
          for name in sorted(f for f in os.listdir(payload) if f.endswith(".tar.gz")):
              path = os.path.join(payload, name)
              chunks = sorted(
                  "chunks/" + c
                  for c in os.listdir(os.path.join(payload, "chunks"))
                  if c.startswith(name + ".")
              )
              files[name] = {
                  "sha256": sha256(path),
                  "bytes": os.path.getsize(path),
                  "chunks": chunks,
              }

          log = open("/tmp/log-snapshot.txt", errors="replace").read()
          if token:
              log = log.replace(token, "***REDACTED***")
          with open(os.path.join(payload, "BUILD-LOG.txt"), "w") as f:
              f.write(log)

          probe = os.path.join(payload, "probe", "probe-3mb.bin")
          manifest = {
              "status": "ready",
              "cache_key": os.environ["CACHE_KEY"],
              "generated_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "source_sha": os.environ.get("GITHUB_SHA"),
              "built_on": "debian:12 container on ubuntu-latest",
              "smoke": open(os.path.join(payload, "SMOKE-RESULT.txt")).read().strip(),
              "files": files,
              "probe_3mb_sha256": sha256(probe) if os.path.exists(probe) else None,
          }
          with open(os.path.join(payload, "MANIFEST.json"), "w") as f:
              json.dump(manifest, f, indent=2, ensure_ascii=False)
          print(json.dumps({k: v for k, v in manifest.items() if k != "files"}, indent=2))
          PY
          cat > NOTES.md <<'NOTES'
          # cache/rust-toolchain の中身

          Arena の開発サンドボックス（Debian 12 / glibc 2.36 / cargo・rustc 無し / crates.io 到達不可）
          で Rust を動かすための一式。`.github/workflows/toolchain-export.yml` が生成した。
          孤立ブランチなので main にも作業ブランチにも影響しない。いつでも削除してよい:

              git push origin --delete cache/rust-toolchain

          ## 中身

          - `MANIFEST.json` … status / cache_key / 各 tar.gz の sha256 とチャンク一覧
          - `BUILD-LOG.txt` … 生成時のログ（Actions のログはサンドボックスから読めないため同梱）
          - `ENV-INFO.txt`  … 同梱バイナリの ldd 結果（debian:12 で全部解決できることの確認）
          - `SMOKE-RESULT.txt` … 同梱物だけでビルド＆テストした結果と所要時間
          - `chunks/sysroot.tar.gz.NNN` … rustc / cargo / rust-std / rustfmt / clippy の sysroot
          - `chunks/vendor.tar.gz.NNN`  … `cargo vendor` の出力（vendor-src/ と vendor-config.toml）
          - `probe/` … 取り出し経路の検証用（3MB のランダムデータと sha256）

          ## サンドボックス側での展開

          /home/user/build はスナップショット対象外（＝サンドボックス再作成で消える）ので、
          消えていたらここからやり直す。

          ```sh
          mkdir -p /home/user/build && cd /home/user/build
          curl -sSL -H "Authorization: Bearer $(gh auth token)" -o tc.tgz \
            "https://codeload.github.com/sonneko/novnow/tar.gz/refs/heads/cache/rust-toolchain"
          tar xzf tc.tgz && cd novnow-cache-rust-toolchain
          cat chunks/sysroot.tar.gz.* > sysroot.tar.gz
          cat chunks/vendor.tar.gz.*  > vendor.tar.gz
          sha256sum -c SHA256SUMS
          mkdir -p /home/user/build/sysroot /home/user/build/cargo-home
          tar xzf sysroot.tar.gz -C /home/user/build/sysroot
          tar xzf vendor.tar.gz  -C /home/user/build
          cat > /home/user/build/cargo-home/config.toml <<'CFG'
          [source.crates-io]
          replace-with = "vendored-sources"

          [source.vendored-sources]
          directory = "/home/user/build/vendor-src"

          [net]
          offline = true
          CFG
          cat > /home/user/build/env.sh <<'ENVS'
          export PATH=/home/user/build/sysroot/bin:$PATH
          export RUSTC=/home/user/build/sysroot/bin/rustc
          export CARGO_HOME=/home/user/build/cargo-home
          export CARGO_NET_OFFLINE=true
          ENVS
          ```

          そのあと、コマンドごとに次を読む（bash の呼び出しごとに環境は引き継がれないため）:

          ```sh
          . /home/user/build/env.sh && cd /home/user/novnow && cargo test --all-targets
          ```
          NOTES
          git add -A
          git commit -q -m "toolchain-export: rust sysroot + vendored crates ($CACHE_KEY)"
          git push -q origin "$CACHE_BRANCH"
          echo "pushed. branch contents (bytes, path):"
          git ls-tree -r --long HEAD | awk '{print $4, $5}'

      - name: 10 publish failure info
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          CACHE_BRANCH="${CACHE_BRANCH:-cache/rust-toolchain}"
          mkdir -p "$PAYLOAD"
          cd "$PAYLOAD"
          if [ ! -d .git ]; then
            git init -q -b "$CACHE_BRANCH"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config http.postBuffer 524288000
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          last=$(tail -1 "$PROGRESS" 2>/dev/null || echo unknown)
          python3 - "$last" <<'PY' || true
          import json, os, sys, time
          token = os.environ.get("GH_TOKEN", "")
          log = open(os.environ.get("LOG", "/tmp/build.log"), errors="replace").read()
          if token:
              log = log.replace(token, "***REDACTED***")
          open("BUILD-LOG.txt", "w").write(log)
          json.dump({
              "status": "failed",
              "failed_step": sys.argv[1],
              "cache_key": os.environ.get("CACHE_KEY", ""),
              "generated_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
          }, open("MANIFEST.json", "w"), indent=2)
          PY
          ls -l
          git add -A
          git commit -q -m "toolchain-export: FAILED at $last" || echo "nothing to commit"
          git push -q -f origin "$CACHE_BRANCH" || echo "push failed too"
