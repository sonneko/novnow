# Python ホイール（§19.3.1 の 5 構成）。abi3-py39 なので 1 構成 1 ホイールで 3.9+ を賄う。
#
# - push / pull_request: ビルドだけ（公開しない）。
# - タグ `v*`: TestPyPI へリハーサル公開。
# - リリース: PyPI 本番（`environment: pypi` の承認を通す）。
#
# 前提: pyo3 系のクレートの vendoring（REF:docs/add-dependencies.md §2.2、
# 対象一覧は REF:docs/plans.md §5.5）。CI ランナーは crates.io に到達できるので通常解決する。
name: wheels

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths: ["python/**", ".github/workflows/wheels.yml", "src/**", "Cargo.toml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-13
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: python/novnow-py
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the wheel (abi3-py39)
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --target ${{ matrix.target }} --out dist
          working-directory: python/novnow-py
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: python/novnow-py/dist/*.whl

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: wheel-x86_64-unknown-linux-gnu
          path: dist
      - name: Install and import
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install dist/*.whl
          python -c "import novnow; print(novnow.__version__, len(novnow.operations()))"
          pytest python/novnow-py

  publish-testpypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: github.event_name == 'release'
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
