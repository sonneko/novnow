# Python ホイール（§19.3.1 の構成）。abi3-py39 なので 1 構成 1 ホイールで 3.9+ を賄う。
#
# ビルドは 5 構成（ubuntu x64 / ubuntu arm64 / macos x64 / macos arm64 / windows x64）。
# Intel Mac は macos-latest（arm64）から `--target x86_64-apple-darwin` で作る。
#
# - push / pull_request: ビルドだけ（公開しない）。
# - workflow_dispatch: 選択したときだけ TestPyPI / PyPI へ公開。
# - タグ公開の本流は release.yml（15 成果物の後に TestPyPI）が担う。
#
# 前提: pyo3 系のクレートの vendoring（REF:docs/add-dependencies.md §2.2、
# 対象一覧は REF:docs/plans.md §5.5）。CI ランナーは crates.io に到達できるので通常解決する。
name: wheels

on:
  push:
    branches: [main]
  pull_request:
    paths: ["python/**", ".github/workflows/wheels.yml", "src/**", "Cargo.toml"]
  workflow_dispatch:
    inputs:
      publish_testpypi:
        description: Publish to TestPyPI after all tests pass
        type: boolean
        default: false
      publish_pypi:
        description: Publish to PyPI after all tests pass (requires approval)
        type: boolean
        default: false

permissions:
  contents: read

# 同じブランチで push し直したら、古い実行は取り消す（macos の行列は待ち時間が長く、
# 終わった頃には内容が古い、という無駄が出る）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# draft の PR では走らせない（`ci.yml` と同じ条件。Actions の使用量を抑える）。
jobs:
  prepare:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      wheels: ${{ steps.matrix.outputs.wheels }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH_TESTPYPI: ${{ inputs.publish_testpypi }}
          PUBLISH_PYPI: ${{ inputs.publish_pypi }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ] && [ "$PUBLISH_PYPI" = true ] && [ "$PUBLISH_TESTPYPI" != true ]; then
            echo "::error::PyPI publication requires the TestPyPI gate in the same run"
            exit 1
          fi
          python3 scripts/release-matrix.py --check
          echo "wheels=$(python3 scripts/release-matrix.py --wheels)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.wheels) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: python/novnow-py
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Prepare Rosetta for the Intel macOS Python
        if: matrix.target == 'x86_64-apple-darwin' && runner.arch == 'ARM64'
        run: sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.python_arch }}
      - name: Verify the committed Cargo.lock still resolves
        working-directory: python/novnow-py
        # Windows の既定シェルは PowerShell で、`>/dev/null` が `C:\dev\null` への
        # リダイレクトとして失敗する。ランナーには Git Bash が入っているので bash で走らせる。
        shell: bash
        run: |
          # `python/novnow-py` は root の `[workspace] exclude` なので独自の Cargo.lock を持つ
          # （pyo3 0.22.6 ＋ 97 パッケージ。`cache/pyo3-crates` の vendor を使って
          # サンドボックスで生成し、commit したもの）。`--locked` で解決できる＝置いた
          # lock が Cargo.toml と食い違っていないことを確認する。食い違ったら
          # `cargo generate-lockfile` して commit し直す。
          cargo metadata --locked --format-version 1 >/dev/null
          cargo tree --locked --depth 1 | head -20
      - name: Build the manylinux wheel (abi3-py39)
        if: contains(matrix.target, 'linux')
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --locked --release --target ${{ matrix.target }} --out dist --manylinux 2_28
          working-directory: python/novnow-py
      - name: Build the macOS or Windows wheel (abi3-py39)
        if: ${{ !contains(matrix.target, 'linux') }}
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --locked --release --target ${{ matrix.target }} --out dist
          working-directory: python/novnow-py
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
      - name: Verify generated wheel filename
        shell: bash
        run: test -f "dist/${{ matrix.artifact }}"
      - name: Install and import this target's wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --force-reinstall "dist/${{ matrix.artifact }}"
          python -c 'import novnow,os,tomllib; expected=tomllib.load(open(os.path.join(os.environ["GITHUB_WORKSPACE"],"Cargo.toml"),"rb"))["package"]["version"]; assert novnow.__version__ == expected; assert novnow.operations(); print(novnow.__version__, len(novnow.operations()))'
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: python/novnow-py/dist/${{ matrix.artifact }}

  test:
    needs: build
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: wheel-x86_64-unknown-linux-gnu
          path: dist
      - name: Install and import
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install dist/*.whl
          python -c 'import novnow,tomllib; expected=tomllib.load(open("Cargo.toml","rb"))["package"]["version"]; assert novnow.__version__ == expected; print(novnow.__version__, len(novnow.operations()))'
          pytest python/novnow-py

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_testpypi
    needs: test
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: always() && github.event_name == 'workflow_dispatch' && inputs.publish_pypi && needs.publish-testpypi.result != 'failure' && needs.publish-testpypi.result != 'cancelled'
    needs: [test, publish-testpypi]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
