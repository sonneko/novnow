# Python ホイール（§19.3.1 の構成）。abi3-py39 なので 1 構成 1 ホイールで 3.9+ を賄う。
#
# ビルドは 4 構成（ubuntu x64 / ubuntu arm64 / macos arm64 / windows x64）。macos-13 の
# x86_64-apple-darwin はランナーの待ち行列が数十分単位で、得られる確認以上のコストになるため**廃止**した
# （2026-10-23 のユーザー裁定）。Intel Mac 向けのホイールが要るときは `macos-latest` で
# `--target x86_64-apple-darwin` を指定する構成を足す（ランナーは arm64 のまま）。
#
# - push / pull_request: ビルドだけ（公開しない）。
# - タグ `v*`: TestPyPI へリハーサル公開。
# - リリース: PyPI 本番（`environment: pypi` の承認を通す）。
#
# 前提: pyo3 系のクレートの vendoring（REF:docs/add-dependencies.md §2.2、
# 対象一覧は REF:docs/plans.md §5.5）。CI ランナーは crates.io に到達できるので通常解決する。
name: wheels

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths: ["python/**", ".github/workflows/wheels.yml", "src/**", "Cargo.toml"]
  workflow_dispatch:

permissions:
  contents: read

# 同じブランチで push し直したら、古い実行は取り消す（macos の行列は待ち時間が長く、
# 終わった頃には内容が古い、という無駄が出る）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# draft の PR では走らせない（`ci.yml` と同じ条件。Actions の使用量を抑える）。
jobs:
  build:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: python/novnow-py
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify the committed Cargo.lock still resolves
        working-directory: python/novnow-py
        # Windows の既定シェルは PowerShell で、`>/dev/null` が `C:\dev\null` への
        # リダイレクトとして失敗する。ランナーには Git Bash が入っているので bash で走らせる。
        shell: bash
        run: |
          # `python/novnow-py` は root の `[workspace] exclude` なので独自の Cargo.lock を持つ
          # （pyo3 0.22.6 ＋ 97 パッケージ。`cache/pyo3-crates` の vendor を使って
          # サンドボックスで生成し、commit したもの）。`--locked` で解決できる＝置いた
          # lock が Cargo.toml と食い違っていないことを確認する。食い違ったら
          # `cargo generate-lockfile` して commit し直す。
          cargo metadata --locked --format-version 1 >/dev/null
          cargo tree --locked --depth 1 | head -20
      - name: Build the wheel (abi3-py39)
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --target ${{ matrix.target }} --out dist
          working-directory: python/novnow-py
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: python/novnow-py/dist/*.whl

  test:
    needs: build
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: wheel-x86_64-unknown-linux-gnu
          path: dist
      - name: Install and import
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install dist/*.whl
          python -c "import novnow; print(novnow.__version__, len(novnow.operations()))"
          pytest python/novnow-py

  publish-testpypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: github.event_name == 'release'
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
