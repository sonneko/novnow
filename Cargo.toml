[package]
name = "novnow"
version = "0.1.0"
edition = "2021"
description = "小説プロジェクト（[title]/ レイアウト）向け執筆 IDE — egui + ropey"
license = "MIT"

[[bin]]
name = "novnow"
path = "src/main.rs"

[dependencies]
eframe = "0.27.2"
egui = "0.27.2"

ropey = "1.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
aho-corasick = "1.1"
fontdb = "0.16"
anyhow = "1.0"
thiserror = "1.0"
unicode-normalization = "0.1"
toml = "0.8"
rfd = "0.14"
web-time = "0.2"
zip = { version = "2.1", default-features = false, features = ["deflate"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "fs", "sync", "macros", "time"] }
directories = "5.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", features = ["sync", "macros", "rt", "time"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement", "Storage", "Blob", "BlobPropertyBag", "Url", "console",
  "IdbFactory", "IdbDatabase", "IdbObjectStore", "IdbTransaction", "IdbRequest", "IdbOpenDbRequest", "IdbCursor", "IdbKeyRange"
] }
console_error_panic_hook = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
