[workspace]
# 既定はこのクレートだけ（`cargo build` / `cargo test` が Python 拡張を巻き込まない）。
default-members = ["."]
# Python 拡張（REF:python/novnow-py）は pyo3 系の vendoring が済むまで解決から外す
# （REF:docs/add-dependencies.md §2.2、対象一覧は REF:docs/plans.md §5.5）。
# vendoring 後は exclude を外して member にする。
exclude = ["python/novnow-py"]

[package]
name = "novnow"
version = "0.1.0"
edition = "2021"
description = "小説プロジェクト（[title]/ レイアウト）向け執筆 IDE — egui + ropey"
license = "MIT"

[lib]
name = "novnow"
path = "src/lib.rs"

[[bin]]
name = "novnow"
path = "src/main.rs"

[features]
# **既定は空**。GUI（§3.3 の `ui` 層）に要るクレートだけを立てる `ui` feature を持つ。
#
# M7 まで `src/ui/**` は空の stub なので、egui / eframe（依存ツリーは 200 クレート規模）を
# 毎回ビルドするのは CI の 4 ジョブと手元のビルドの時間を無駄にする（2026-10-11 の
# ユーザー承認、`docs/history.md` B-54）。core / ports / adapters は GUI なしでビルドでき、
# §3.2 の「core は egui / eframe / rfd に依存しない」は `tests/layering.rs` が検査する。
#
# M7 で `src/ui/**` に egui のコードが入ったら、`.github/workflows/ci.yml` の 4 コマンドに
# `--features ui` を足す（同ファイルの TODO も参照）。GUI 付きのビルドは
# `cargo build --features ui` / `cargo run --features ui`。
#
# `toml`（文言カタログ `ui/i18n/*.toml` の読み込み）は M6 から**常に**入れる: CLI のメッセージも
# 同じカタログを使う（§12.2）ので、`ui::i18n` は GUI なしのビルドにも要る（`docs/history.md` B-100）。
default = []
ui = ["dep:eframe", "dep:egui", "dep:rfd", "dep:fontdb", "dep:image"]

[dependencies]
# 以下 4 つ（eframe / egui / rfd / fontdb）は `ui` feature のときだけ（上記）。層は `docs/designs/overview.md` §3.2 の依存表のとおり ui。
eframe = { version = "0.27.2", optional = true }
egui = { version = "0.27.2", optional = true }
image = { version = "0.24.9", default-features = false, features = ["png", "jpeg"], optional = true }

# 行区切りを LF のみにする（`docs/specifications/syntax.md` §5.0.4「内部表現は LF」）。
# 既定 feature の unicode_lines は U+2028 等も行区切りにしてしまい、本文にそれが
# 含まれると行番号がずれるため落とす（simd は性能のため残す）。
ropey = { version = "1.6", default-features = false, features = ["simd"] }
# §6.2.6（S-09 / F-23）の簡易形態素解析（`'` 未解決参照の赤波線範囲と語幹の切り出し）。
# 依存ゼロ・純 Rust・乱数も I/O も持たない（モデルは同梱）ので `src/core/**` に置ける
# （§3.2 の許可クレート表と `tests/layering.rs` の `ALLOWED_ROOTS` を参照）。
tiniestsegmenter = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
aho-corasick = "1.1"
fontdb = { version = "0.16", optional = true }
anyhow = "1.0"
thiserror = "1.0"
unicode-normalization = "0.1"
# `ui::i18n` が文言カタログを読む（GUI と CLI の両方。上の [features] の注記）。
toml = "0.8"
rfd = { version = "0.14", optional = true }
web-time = "0.2"
zip = { version = "2.1", default-features = false, features = ["deflate"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "fs", "sync", "macros", "time"] }
directories = "5.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", features = ["sync", "macros", "rt", "time"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# IndexedDB（§13.3、`src/adapters/storage_idb.rs`）に要る feature も含む（M5 で足した: IdbIndex 以降）。
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement", "Storage", "Blob", "BlobPropertyBag", "Url", "console",
  "IdbFactory", "IdbDatabase", "IdbObjectStore", "IdbTransaction", "IdbRequest", "IdbOpenDbRequest", "IdbCursor", "IdbKeyRange",
  "IdbIndex", "IdbObjectStoreParameters", "IdbTransactionMode", "DomException", "DomStringList", "Event",
  "Navigator", "StorageManager", "StorageEstimate",
  # Web のプロジェクト選択（§13.4）とキーの既定動作の抑止・離脱の確認（`src/ui/web.rs`）
  "KeyboardEvent", "BeforeUnloadEvent", "HtmlInputElement", "FileList", "File", "EventTarget", "Clipboard"
] }
console_error_panic_hook = "0.1"

[dev-dependencies]
# tests/layering.rs が src/core/** の AST を訪走するために使う（§3.2 / §12.2 の機械検査）。
# 実行時には一切依存しない（dev-dependency）。
proc-macro2 = "1"
syn = { version = "2.0", features = ["full", "visit"] }
# tests/layering.rs が Cargo.toml 自身を読んで feature gate（上の [features]）を検査するのに使う
# （`toml` は M6 から通常の依存でもあるが、テストの用途を明示するために dev 側にも残す）。
toml = "0.8"
# §18.1 / §18.4 の性能ベンチマーク（B-25）。描画バックエンド（plotters）・並列（rayon）は不要なので落とす。
criterion = { version = "0.5.1", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "core"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
