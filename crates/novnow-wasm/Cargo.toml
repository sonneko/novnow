[package]
name = "novnow-wasm"
version = "0.0.0"
edition = "2021"
description = "novnow の第 2 の画面実装（REF:docs/specifications/webui.md §21）のためのブラウザ用の橋渡し"
license = "MIT"
repository = "https://github.com/sonneko/novnow"
publish = false

# WebAssembly（ブラウザ）専用。ネイティブでビルドしない（`cargo check` は wasm32 を指定する）。
[lib]
name = "novnow_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
# 機能核（§19.1 の単一実装点）。**このクレートから見えるのは `Session` の JSON の口だけ**
# （`src/` は第 2 のために変えない。`REF:docs/plans.md#webui-parallel` の所有者表）。
novnow = { path = "../..", default-features = false }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlElement", "Storage", "console",
    "IdbFactory", "IdbDatabase", "IdbObjectStore", "IdbTransaction", "IdbRequest",
    "IdbOpenDbRequest", "IdbCursor", "IdbKeyRange", "IdbIndex", "IdbObjectStoreParameters",
    "IdbTransactionMode", "DomException", "DomStringList", "Event", "EventTarget",
    "Navigator", "StorageManager", "StorageEstimate", "Location",
] }
