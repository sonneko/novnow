<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>novnow — 小説プロジェクト向け執筆 IDE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#1a1a1a">
    <link data-trunk rel="copy-file" href="sw.js">
    <link data-trunk rel="copy-file" href="manifest.webmanifest">
    <link data-trunk rel="copy-file" href="icon.svg">
    <link rel="rust" data-trunk href="Cargo.toml" data-bin="novnow" data-cargo-features="ui" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a1a;
        }
        /* eframe の Web が前提にする置き方（eframe_template と同じ）。eframe は IME の変換候補を出す隠れた
           入力欄の位置を「canvas が横に 50% ずらしてある」前提で計算するので、left: 50% と translate(-50%) が
           要る（無いと変換候補が左に canvas の幅の半分ずれる）。display: block は行の下の隙間を無くす。 */
        canvas {
            margin-right: auto;
            margin-left: auto;
            display: block;
            position: absolute;
            top: 0%;
            left: 50%;
            transform: translate(-50%, 0%);
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <canvas id="the_canvas_id"></canvas>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(console.warn));
      }
    </script>
</body>
</html>
