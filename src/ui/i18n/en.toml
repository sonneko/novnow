# ============================================================ CLI (§14, M6)
#
# - The first line follows "novnow: " (§14.2.2), so en messages start in lower case (§14.2.3).
# - tests/cli.rs compares the §14.2.2 / §14.2.3 / §14.2.4 samples with the spec, character by character.
# - Command names (`novnow`, `new`, `check`) and keys (`schema_version`) are not translated (§12.6).

[cli.error]
incomplete = "this directory is not a novnow project"
missing_items = "Missing items"
not_found = "directory not found"
not_a_directory = "not a directory"
unreadable = "could not read: {0}"
legacy_v0 = "this project is in the v0 format ({0} found)"
legacy_schema = "this project is in the v0 format (project.json has no schema_version, or it is 0)"
too_new = "this project was made by a newer version of novnow (schema_version {0})"
encoding = "some files are not valid UTF-8"
unknown_option = "unknown option: {0}"
unexpected_argument = "unexpected argument: {0}"
missing_dir = "novnow {0} needs a directory"
not_implemented = "novnow {0} is not implemented yet"
no_gui = "this build of novnow does not include the GUI"
write_failed = "could not write: {0}"

[cli.label]
target = "target"
