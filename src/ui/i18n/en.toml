# ============================================================ Where the problem is (§14.2.5, §10.9.2, rev. 2.11)
#
# The cases of `core::features::place`, used by the `[…]` of `novnow check` and by the "where"
# column of the GUI's diagnostics tab. {0} {1} are strings as written in the files (structure IDs
# without `@`, names, IDs, titles).

