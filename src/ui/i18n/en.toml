# novnow UI message catalog (English). SPECIFICATIONS.md §12.3.
#
# - Keys are `<area>.<target>.<word>` (§12.3). `E004` in the `[diag]` table is `diag.E004`.
# - Placeholders are positional only: `{0}`, `{1}` (§12.3), in the order of `Diagnostic::args`.
# - `[diag]` is a **copy** of the en column of the §7 / §7.1 / §7.2 tables (the spec is the source).
#   `tests/i18n_catalog.rs` re-reads the spec and ja.toml and checks that keys, placeholders and
#   messages agree (the CI check required by §12.3). Change the spec table **first**.
# - M4 added the diagnostics (`diag.*`), M6 the CLI (`cli.*`, §14). Status bar and palette messages come
#   in M7 (PLANS.md §3 I6). The `cli.*` keys listed in the §12.7 table are copies of that table
#   (checked by tests/i18n_catalog.rs).

