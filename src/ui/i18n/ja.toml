# novnow の UI 文言カタログ（日本語）。SPECIFICATIONS.md §12.3。
#
# - キーは `<領域>.<対象>.<語>`（§12.3）。TOML のテーブル `[diag]` の `E004` が `diag.E004`。
# - プレースホルダは `{0}` `{1}` の位置引数だけ（§12.3）。core が返す `Diagnostic::args` の順。
# - `[diag]` は §7 / §7.1 / §7.2 の表の ja 文言の**写し**（正本は仕様書）。
#   `tests/i18n_catalog.rs` が仕様書と en.toml を読み直して、キー集合・プレースホルダ・文言の
#   一致を検査する（§12.3 の CI チェック MUST）。文言を変えるときは**先に仕様書の表**を直すこと。
# - M4 では診断（`diag.*`）だけを置く。ステータスバー・パレット・CLI の文言は M6〜M7 で足す
#   （PLANS.md §3 I6）。

