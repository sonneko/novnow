# ============================================================ CLI（§14、M6）
#
# - 1 行目は「novnow: 」に続く（§14.2.2）。en は小文字で始める（§14.2.3）。
# - §14.2.2 / §14.2.3 / §14.2.4 の出力例は tests/cli.rs が仕様書と一字一句突き合わせる。
# - `novnow` `new` `check` などのコマンド名・`schema_version` などのキーは翻訳しない（§12.6）。

[cli.error]
