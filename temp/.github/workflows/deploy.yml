name: Deploy

# メインブランチへの push のうち、デプロイに影響するファイルが変更されたときのみ走らせる。
# GitHub Pages、Vercel、Cloudflare Pages 等のデプロイ先に合わせて調整すること。

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # --- プロジェクト固有のビルドコマンドをここに追加する ---
      # 例（静的サイト）:
      # - uses: actions/setup-node@v4
      # - run: npm ci
      # - run: npm run build
      # - uses: actions/upload-pages-artifact@v3
      #   with:
      #     path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
